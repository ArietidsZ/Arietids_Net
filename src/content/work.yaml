- id: "linear-algebra-invariants"
  visibility: "public"
  kind: "writing"
  order: 9
  title:
    zh: "线性代数中的那些不变量——从翻棋游戏谈起"
    en: "Invariants in Linear Algebra: Starting from a Board-Flipping Game"
  summary:
    zh: "课程报告，从翻棋游戏出发，讨论线性代数中的不变量与标准形。"
    en: "A course report on invariants and canonical forms in linear algebra,
      starting from a board-flipping game."
  description:
    zh: "以有限域模型分析翻棋操作，梳理矩阵变换、等价关系与分类，并联系机器学习中的不变性。"
    en: "Uses a finite-field model of board-flipping operations to discuss matrix
      transformations, equivalence and classification, with connections to
      invariance in machine learning."
  status: "coursework"
  statusNote:
    zh: "课程报告"
    en: "Course report"
  themes:
    - "learning"
